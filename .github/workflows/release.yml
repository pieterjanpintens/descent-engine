name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: Descent-Engine

permissions:
  contents: write

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # The app reads its own version from here (AppUpdater.current_version()) to tell whether a newer release exists.
      - name: Stamp the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="dev"; fi
          sed -i "s|^config/name=.*|&\nconfig/version=\"${V}\"|" project.godot
          grep -n "^config/" project.godot

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"

      - name: Zip build
        run: |
          apt-get update && apt-get install -y zip
          cd build/windows
          zip -r "../../${EXPORT_NAME}-windows.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.EXPORT_NAME }}-windows.zip

  export-linux:
    name: Linux Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Stamp the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="dev"; fi
          sed -i "s|^config/name=.*|&\nconfig/version=\"${V}\"|" project.godot
          grep -n "^config/" project.godot

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"

      - name: Zip build
        run: |
          apt-get update && apt-get install -y zip
          cd build/linux
          zip -r "../../${EXPORT_NAME}-linux.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.EXPORT_NAME }}-linux.zip

  export-macos:
    name: macOS Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Stamp the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="dev"; fi
          sed -i "s|^config/name=.*|&\nconfig/version=\"${V}\"|" project.godot
          grep -n "^config/" project.godot

      # The "macOS" preset exports a universal (Intel + Apple silicon) .app inside a zip, ad-hoc signed by Godot's built-in
      # signer - no Apple account, so macOS shows an "unidentified developer" warning on first launch (right-click > Open).
      - name: macOS Build
        run: |
          mkdir -v -p build/macos
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "macOS" "$EXPORT_DIR/macos/${EXPORT_NAME}-macos.zip"

      # Not the release file yet: sign-macos below re-signs it on a Mac.
      - name: Rename
        run: mv "build/macos/${EXPORT_NAME}-macos.zip" "${EXPORT_NAME}-macos-unsigned.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: ${{ env.EXPORT_NAME }}-macos-unsigned.zip

  # Godot's built-in signer (the only one available in the Linux container) always turns the "hardened runtime" on.
  # Under it the microphone and loading the downloaded speech library need entitlements, and an app that Godot
  # signed WITH entitlements is killed by macOS the moment it starts (seen with v0.0.14 / v0.0.15). So the app is
  # re-signed here with Apple's own codesign: plain ad-hoc, no hardened runtime, no entitlements needed.
  sign-macos:
    name: macOS Sign
    needs: [export-macos]
    runs-on: macos-14
    steps:
      - name: Download the export
        uses: actions/download-artifact@v4
        with:
          name: macos-unsigned

      - name: Re-sign
        run: |
          mkdir app
          ditto -x -k "${EXPORT_NAME}-macos-unsigned.zip" app
          codesign --force --deep --sign - "app/${EXPORT_NAME}.app"
          codesign --verify --deep --strict "app/${EXPORT_NAME}.app"
          codesign -dv "app/${EXPORT_NAME}.app"
          ditto -c -k --keepParent "app/${EXPORT_NAME}.app" "${EXPORT_NAME}-macos.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ env.EXPORT_NAME }}-macos.zip

  package-asset-tools:
    name: Package asset tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the tools zip
        run: python3 tools/package_asset_tools.py "Descent-Engine-asset-tools.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-tools
          path: Descent-Engine-asset-tools.zip

  # The standalone import tool the app downloads for its "Game assets" button (tools/asset_import/build_importer.py):
  # the Python import tools + UnityPy packaged with PyInstaller, which cannot cross-compile - one runner per platform.
  # continue-on-error: a platform whose build breaks must not block the whole release (the app then says importing
  # isn't available there and the asset tools zip still works).
  build-importer:
    name: Import tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UnityPy and PyInstaller
        run: python -m pip install UnityPy pyinstaller

      - name: Build the import tool
        run: python tools/asset_import/build_importer.py importer-dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: importer-${{ matrix.os }}
          path: importer-dist/*

  release:
    name: Create Release
    needs: [export-windows, export-linux, sign-macos, package-asset-tools, build-importer]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Drop the unsigned macOS export
        run: rm -f dist/*-macos-unsigned.zip

      # SHA-256 of every file of the release, so downloads can be verified (the builds are not code-signed).
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
