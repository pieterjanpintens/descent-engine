name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: Descent-Engine

permissions:
  contents: write

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"

      - name: Zip build
        run: |
          apt-get update && apt-get install -y zip
          cd build/windows
          zip -r "../../${EXPORT_NAME}-windows.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.EXPORT_NAME }}-windows.zip

  export-linux:
    name: Linux Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"

      - name: Zip build
        run: |
          apt-get update && apt-get install -y zip
          cd build/linux
          zip -r "../../${EXPORT_NAME}-linux.zip" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.EXPORT_NAME }}-linux.zip

  export-macos:
    name: macOS Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # The "macOS" preset exports a universal (Intel + Apple silicon) .app inside a zip, ad-hoc signed by Godot's built-in
      # signer - no Apple account, so macOS shows an "unidentified developer" warning on first launch (right-click > Open).
      - name: macOS Build
        run: |
          mkdir -v -p build/macos
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "macOS" "$EXPORT_DIR/macos/${EXPORT_NAME}-macos.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/${{ env.EXPORT_NAME }}-macos.zip

  package-asset-tools:
    name: Package asset tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the tools zip
        run: python3 tools/package_asset_tools.py "Descent-Engine-asset-tools.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-tools
          path: Descent-Engine-asset-tools.zip

  # The standalone import tool the app downloads for its "Game assets" button (tools/asset_import/build_importer.py):
  # the Python import tools + UnityPy packaged with PyInstaller, which cannot cross-compile - one runner per platform.
  # continue-on-error: a platform whose build breaks must not block the whole release (the app then says importing
  # isn't available there and the asset tools zip still works).
  build-importer:
    name: Import tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UnityPy and PyInstaller
        run: python -m pip install UnityPy pyinstaller

      - name: Build the import tool
        run: python tools/asset_import/build_importer.py importer-dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: importer-${{ matrix.os }}
          path: importer-dist/*

  release:
    name: Create Release
    needs: [export-windows, export-linux, export-macos, package-asset-tools, build-importer]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA-256 of every file of the release, so downloads can be verified (the builds are not code-signed).
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
